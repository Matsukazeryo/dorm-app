<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f7f9">
  <title>荷物・郵便 掲示板</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png?v=20260723">
  <style>
    :root {
      --page-bg: #f4f7f9;
      --surface: #ffffff;
      --text: #17212b;
      --muted: #52606d;
      --line: #cfd8df;
      --shofu: #864a2b;
      --meizen: #2a6686;
      --ticker-height: 74px;
      --safe-top: max(16px, env(safe-area-inset-top));
      --safe-right: max(20px, env(safe-area-inset-right));
      --safe-left: max(20px, env(safe-area-inset-left));
      --burn-x: 0px;
      --burn-y: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .board-shell {
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      margin: 1px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) var(--ticker-height);
      transform: translate3d(var(--burn-x), var(--burn-y), 0);
    }

    .board-header {
      min-height: 58px;
      padding: var(--safe-top) var(--safe-right) 8px var(--safe-left);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #c8d1d8;
      background: var(--surface);
    }

    .board-title {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .board-title h1 {
      margin: 0;
      font-size: clamp(24px, 2vw, 36px);
      line-height: 1.05;
      font-weight: 800;
    }

    .board-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .settings-button,
    .fullscreen-button {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #9eabb5;
      border-radius: 6px;
      background: #fff;
      color: #23313d;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .settings-button:hover,
    .settings-button:focus-visible,
    .fullscreen-button:hover,
    .fullscreen-button:focus-visible {
      background: #e8eef2;
      outline: 3px solid rgba(42, 102, 134, 0.25);
    }

    :fullscreen .settings-button,
    :fullscreen .fullscreen-button {
      display: none;
    }

    :fullscreen .board-shell {
      grid-template-rows: minmax(0, 1fr) var(--ticker-height);
    }

    :fullscreen .board-header {
      display: none;
    }

    :fullscreen .board-main {
      padding-top: 3px;
    }

    :-webkit-full-screen .board-shell {
      grid-template-rows: minmax(0, 1fr) var(--ticker-height);
    }

    :-webkit-full-screen .board-header {
      display: none;
    }

    :-webkit-full-screen .board-main {
      padding-top: 3px;
    }

    .board-main {
      min-height: 0;
      padding: 16px var(--safe-right) 16px var(--safe-left);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      overflow: hidden;
    }

    .dorm-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 5px solid var(--panel-accent);
      border-radius: 4px;
      overflow: hidden;
    }

    .dorm-panel.shofu {
      --panel-accent: var(--shofu);
    }

    .dorm-panel.meizen {
      --panel-accent: var(--meizen);
    }

    .dorm-header {
      min-height: 54px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--text);
      background: #fff;
      border-bottom: 1px solid #d5dde3;
    }

    .dorm-panel.shofu .dorm-header {
      color: var(--shofu);
    }

    .dorm-panel.meizen .dorm-header {
      color: var(--meizen);
    }

    .dorm-name {
      margin: 0;
      font-size: clamp(22px, 2vw, 34px);
      line-height: 1;
      font-weight: 800;
    }

    .resident-list {
      min-height: 0;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: 4px;
      overflow: hidden;
      background: #eef2f4;
    }

    .resident-item {
      min-width: 0;
      min-height: 0;
      padding: 8px 11px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 0;
      border-bottom: 1px solid #d3dbe1;
      border-radius: 2px;
      background: #fff;
    }

    .resident-identity {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 9px;
    }

    .resident-room {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: clamp(13px, 1.08vw, 18px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .resident-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(18px, 1.65vw, 29px);
      line-height: 1.05;
      font-weight: 800;
    }

    .resident-counts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 7px;
    }

    .item-count {
      min-width: 66px;
      min-height: 40px;
      padding: 5px 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #aeb9c1;
      border-radius: 4px;
      background: #f7f9fa;
      color: #27343e;
      font-size: clamp(16px, 1.38vw, 23px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .item-count.luggage {
      border-color: #c6a58e;
      background: #f8f3ef;
      color: #7a4628;
    }

    .item-count.mail {
      border-color: #9db9ae;
      background: #f0f6f3;
      color: #2f6352;
    }

    .item-count.empty {
      visibility: hidden;
    }

    .item-label {
      color: #5e6a73;
      font-size: 0.72em;
    }

    .item-count.luggage .item-label,
    .item-count.mail .item-label {
      color: inherit;
    }

    .resident-list.compact {
      gap: 6px;
      padding: 8px;
    }

    .resident-list.compact .resident-item {
      padding: 5px 8px;
      gap: 7px;
    }

    .resident-list.compact .resident-name {
      font-size: clamp(15px, 1.35vw, 22px);
    }

    .resident-list.compact .resident-room {
      font-size: clamp(11px, 0.92vw, 15px);
    }

    .resident-list.compact .item-count {
      min-width: 54px;
      min-height: 31px;
      padding: 3px 6px;
      font-size: clamp(13px, 1.1vw, 18px);
    }

    .resident-list.dense {
      gap: 4px;
      padding: 6px;
    }

    .resident-list.dense .resident-item {
      padding: 3px 7px;
      gap: 5px;
    }

    .resident-list.dense .resident-identity {
      gap: 6px;
    }

    .resident-list.dense .resident-name {
      font-size: clamp(14px, 1.18vw, 20px);
    }

    .resident-list.dense .resident-room {
      font-size: clamp(10px, 0.82vw, 14px);
    }

    .resident-list.dense .resident-counts {
      gap: 4px;
    }

    .resident-list.dense .item-count {
      min-width: 48px;
      min-height: 27px;
      padding: 2px 5px;
      border-width: 1px;
      font-size: clamp(12px, 0.98vw, 16px);
    }

    .empty-state {
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 24px;
      color: #40505d;
      background: #fff;
      border: 1px solid #c7d1d8;
      border-radius: 5px;
      font-size: clamp(18px, 1.7vw, 30px);
      font-weight: 800;
      text-align: center;
    }

    .ticker {
      min-width: 0;
      min-height: var(--ticker-height);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: stretch;
      border-top: 3px solid #243642;
      background: #101a21;
      color: #fff;
      overflow: hidden;
    }

    .ticker-label {
      position: relative;
      z-index: 2;
      min-width: 154px;
      padding: 0 22px;
      display: grid;
      place-items: center;
      background: #f3c623;
      color: #15191c;
      font-size: clamp(18px, 1.55vw, 27px);
      font-weight: 900;
      white-space: nowrap;
    }

    .ticker-window {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .ticker-track {
      position: absolute;
      left: 100%;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-scroll var(--ticker-duration, 28s) linear infinite;
      font-size: clamp(20px, 1.85vw, 32px);
      font-weight: 800;
    }

    .ticker-separator {
      margin: 0 30px;
      color: #f3c623;
    }

    @keyframes ticker-scroll {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(calc(-100% - 100vw), 0, 0);
      }
    }

    .connection-status {
      position: fixed;
      right: 20px;
      bottom: calc(var(--ticker-height) + 12px);
      z-index: 8;
      max-width: min(430px, calc(100vw - 40px));
      padding: 8px 12px;
      display: none;
      border: 2px solid #9d6600;
      border-radius: 5px;
      background: #fff4cf;
      color: #533600;
      font-size: 14px;
      font-weight: 800;
    }

    .connection-status.visible {
      display: block;
    }

    .loading-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #f4f7f9;
    }

    .loading-layer.hidden {
      display: none;
    }

    .loading-content {
      width: min(520px, calc(100vw - 40px));
      padding: 28px;
      border: 1px solid #aebbc5;
      border-radius: 6px;
      background: #fff;
      text-align: center;
    }

    .loading-title {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    .loading-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .reload-button {
      margin-top: 18px;
      padding: 11px 18px;
      display: none;
      border: 0;
      border-radius: 5px;
      background: #2a6686;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .loading-layer.slow .reload-button {
      display: inline-block;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(18, 28, 35, 0.72);
    }

    .settings-modal.visible {
      display: grid;
    }

    .settings-dialog {
      width: min(620px, 100%);
      padding: 24px;
      border: 1px solid #9eabb5;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    .settings-dialog h2 {
      margin: 0 0 18px;
      font-size: 25px;
    }

    .settings-field {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      color: #344451;
      font-size: 14px;
      font-weight: 800;
    }

    .settings-field textarea,
    .settings-field input {
      width: 100%;
      border: 2px solid #aebbc5;
      border-radius: 5px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 500;
    }

    .settings-field textarea {
      min-height: 130px;
      padding: 11px;
      resize: vertical;
      line-height: 1.55;
    }

    .settings-field input {
      height: 44px;
      padding: 0 11px;
    }

    .settings-field input[type="range"] {
      height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: var(--meizen);
      cursor: pointer;
    }

    .speed-scale {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .speed-scale span:last-child {
      text-align: right;
    }

    .speed-value {
      min-width: 92px;
      padding: 3px 8px;
      border: 1px solid #b8c2c9;
      border-radius: 4px;
      background: #f4f7f9;
      color: #2d3a44;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .settings-field textarea:focus,
    .settings-field input:focus {
      border-color: var(--meizen);
      outline: 3px solid rgba(42, 102, 134, 0.2);
    }

    .settings-error {
      min-height: 20px;
      margin: 9px 0 0;
      color: #a53126;
      font-size: 14px;
      font-weight: 800;
    }

    .settings-actions {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .settings-actions button {
      min-width: 110px;
      min-height: 44px;
      border: 0;
      border-radius: 5px;
      font-weight: 800;
      cursor: pointer;
    }

    .settings-cancel {
      background: #dce3e8;
      color: #25333e;
    }

    .settings-save {
      background: var(--meizen);
      color: #fff;
    }

    .settings-save:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    @media (max-aspect-ratio: 1 / 1) {
      :root {
        --ticker-height: 66px;
      }

      .board-main {
        grid-template-columns: minmax(0, 1fr);
      }

      .dorm-panel {
        min-height: 0;
      }

      .resident-list {
        --columns: 2 !important;
      }
    }

    /* 1024x768-class displays: preserve the two-dorm overview and use the
       available vertical space instead of collapsing the panels. */
    @media (min-aspect-ratio: 4 / 3) and (max-width: 1100px) and (max-height: 820px) {
      :root {
        --ticker-height: 44px;
        --safe-top: max(4px, env(safe-area-inset-top));
        --safe-right: max(10px, env(safe-area-inset-right));
        --safe-left: max(10px, env(safe-area-inset-left));
      }

      .board-header {
        min-height: 42px;
        padding-bottom: 4px;
        gap: 8px;
      }

      .board-title h1 {
        font-size: 21px;
      }

      .settings-button,
      .fullscreen-button {
        width: 32px;
        height: 32px;
        font-size: 19px;
      }

      .board-main {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        padding: 4px var(--safe-right);
        gap: 6px;
      }

      .dorm-panel {
        border-top-width: 3px;
      }

      .dorm-header {
        min-height: 29px;
        padding: 3px 8px;
      }

      .dorm-name {
        font-size: 17px;
      }

      .resident-list,
      .resident-list.compact,
      .resident-list.dense {
        gap: 2px;
        padding: 3px;
      }

      .resident-item,
      .resident-list.compact .resident-item,
      .resident-list.dense .resident-item {
        padding: 2px 5px;
        gap: 4px;
      }

      .resident-identity,
      .resident-list.dense .resident-identity {
        gap: 5px;
      }

      .resident-name {
        font-size: 17px;
        line-height: 1;
      }

      .resident-list.compact .resident-name {
        font-size: 15px;
      }

      .resident-list.dense .resident-name {
        font-size: 13px;
      }

      .resident-room,
      .resident-list.compact .resident-room,
      .resident-list.dense .resident-room {
        font-size: 10px;
        line-height: 1;
      }

      .resident-counts,
      .resident-list.dense .resident-counts {
        gap: 3px;
      }

      .item-count {
        min-width: 48px;
        min-height: 29px;
        padding: 2px 5px;
        gap: 3px;
        font-size: 14px;
        line-height: 1;
      }

      .resident-list.compact .item-count {
        min-width: 43px;
        min-height: 25px;
        padding: 1px 4px;
        font-size: 12px;
      }

      .resident-list.dense .item-count {
        min-width: 39px;
        min-height: 20px;
        padding: 1px 3px;
        font-size: 11px;
      }

      .item-label {
        font-size: 0.68em;
      }

      .empty-state {
        padding: 14px;
        font-size: 18px;
      }

      .ticker-label {
        min-width: 94px;
        padding: 0 10px;
        font-size: 15px;
      }

      .ticker-track {
        font-size: 17px;
      }

      .connection-status {
        right: 10px;
        bottom: calc(var(--ticker-height) + 8px);
      }
    }

    @media (min-width: 1101px) and (max-height: 800px) and (min-aspect-ratio: 4 / 3) {
      :root {
        --ticker-height: 58px;
        --safe-top: max(8px, env(safe-area-inset-top));
      }

      .board-header {
        min-height: 58px;
        padding-bottom: 7px;
        gap: 14px;
      }

      .board-title {
        gap: 10px;
      }

      .board-title h1 {
        font-size: clamp(23px, 2.35vw, 34px);
      }

      .settings-button,
      .fullscreen-button {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .board-main {
        padding-top: 8px;
        padding-bottom: 8px;
        gap: 10px;
      }

      .dorm-header {
        min-height: 42px;
        padding: 6px 12px;
      }

      .dorm-name {
        font-size: clamp(20px, 1.9vw, 28px);
      }

      .resident-list.dense {
        gap: 2px;
        padding: 4px;
      }

      .resident-list.dense .resident-item {
        padding: 1px 5px;
        gap: 4px;
      }

      .resident-list.dense .resident-name {
        font-size: clamp(13px, 1.12vw, 17px);
        line-height: 1;
      }

      .resident-list.dense .resident-room {
        font-size: 10px;
        line-height: 1;
      }

      .resident-list.dense .item-count {
        min-width: 40px;
        min-height: 20px;
        padding: 1px 4px;
        font-size: 11px;
        line-height: 1;
      }

      .ticker-label {
        min-width: 120px;
        padding: 0 15px;
        font-size: 18px;
      }

      .ticker-track {
        font-size: clamp(18px, 1.75vw, 24px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track {
        animation-duration: calc(var(--ticker-duration, 28s) * 1.8);
      }
    }
  </style>
</head>
<body>
  <div class="board-shell">
    <header class="board-header">
      <div class="board-title">
        <h1>荷物・郵便 掲示板</h1>
      </div>
      <div class="board-actions">
        <button id="settings-button" class="settings-button" type="button" aria-label="掲示板のお知らせを編集" title="掲示板のお知らせを編集">⚙</button>
        <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="全画面表示" title="全画面表示">⛶</button>
      </div>
    </header>

    <main class="board-main">
      <section class="dorm-panel shofu" aria-labelledby="shofu-title">
        <header class="dorm-header">
          <h2 id="shofu-title" class="dorm-name">松風寮</h2>
        </header>
        <div id="shofu-list" class="resident-list" style="--panel-accent:var(--shofu)"></div>
      </section>

      <section class="dorm-panel meizen" aria-labelledby="meizen-title">
        <header class="dorm-header">
          <h2 id="meizen-title" class="dorm-name">明善寮</h2>
        </header>
        <div id="meizen-list" class="resident-list" style="--panel-accent:var(--meizen)"></div>
      </section>
    </main>

    <aside class="ticker" aria-label="お知らせ">
      <div class="ticker-label">お知らせ</div>
      <div class="ticker-window">
        <div id="ticker-track" class="ticker-track">お知らせを読み込んでいます</div>
      </div>
    </aside>
  </div>

  <div id="connection-status" class="connection-status" role="status" aria-live="polite"></div>

  <div id="loading-layer" class="loading-layer" role="status" aria-live="polite">
    <div class="loading-content">
      <p class="loading-title">掲示板を読み込んでいます</p>
      <p id="loading-note" class="loading-note">寮生情報へ接続しています。</p>
      <button id="reload-button" class="reload-button" type="button">再読み込み</button>
    </div>
  </div>

  <div id="settings-modal" class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <form id="settings-form" class="settings-dialog">
      <h2 id="settings-title">掲示板のお知らせ</h2>
      <label class="settings-field">
        表示する文章
        <textarea id="settings-message" maxlength="500" placeholder="掲示板の下部に流す文章を入力"></textarea>
      </label>
      <label class="settings-field">
        スクロール速度
        <input id="settings-speed" type="range" min="40" max="140" step="10" value="80">
        <span class="speed-scale">
          <span>ゆっくり</span>
          <output id="settings-speed-value" class="speed-value" for="settings-speed">標準</output>
          <span>速い</span>
        </span>
      </label>
      <label class="settings-field">
        管理者パスワード
        <input id="settings-password" type="password" autocomplete="current-password">
      </label>
      <p id="settings-error" class="settings-error" role="alert"></p>
      <div class="settings-actions">
        <button id="settings-cancel" class="settings-cancel" type="button">キャンセル</button>
        <button id="settings-save" class="settings-save" type="submit">保存</button>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
  <script>
    (function(){
      'use strict';

      var firebaseConfig = {
        apiKey: 'AIzaSyDUevNVtZEycMZ7jl9xSimUqg0PB5SbheY',
        authDomain: 'dorm-manager-30ce8.firebaseapp.com',
        projectId: 'dorm-manager-30ce8',
        storageBucket: 'dorm-manager-30ce8.appspot.com',
        messagingSenderId: '775850695904',
        appId: '1:775850695904:web:0c1ee061060482c1368485',
        measurementId: 'G-Y9XBHQKJW2'
      };

      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      var residents = { shofu: [], meizen: [] };
      var boardMessage = '';
      var tickerSpeed = 80;
      var loaded = { shofu: false, meizen: false, message: false };
      var fromCache = { shofu: false, meizen: false, message: false };
      var renderTimer = 0;
      var tickerSignature = '';
      var loadingTimer = 0;
      var reconnectTimer = 0;

      var elements = {
        shofuList: document.getElementById('shofu-list'),
        meizenList: document.getElementById('meizen-list'),
        tickerTrack: document.getElementById('ticker-track'),
        loadingLayer: document.getElementById('loading-layer'),
        loadingNote: document.getElementById('loading-note'),
        reloadButton: document.getElementById('reload-button'),
        connectionStatus: document.getElementById('connection-status'),
        settingsButton: document.getElementById('settings-button'),
        settingsModal: document.getElementById('settings-modal'),
        settingsForm: document.getElementById('settings-form'),
        settingsMessage: document.getElementById('settings-message'),
        settingsSpeed: document.getElementById('settings-speed'),
        settingsSpeedValue: document.getElementById('settings-speed-value'),
        settingsPassword: document.getElementById('settings-password'),
        settingsError: document.getElementById('settings-error'),
        settingsCancel: document.getElementById('settings-cancel'),
        settingsSave: document.getElementById('settings-save'),
        fullscreenButton: document.getElementById('fullscreen-button')
      };

      function toCount(value){
        var count = parseInt(value, 10);
        return isFinite(count) && count > 0 ? count : 0;
      }

      function normalizeTickerSpeed(value){
        var speed = parseInt(value, 10);
        if (!isFinite(speed)) speed = 80;
        speed = Math.max(40, Math.min(140, speed));
        return Math.round(speed / 10) * 10;
      }

      function tickerSpeedLabel(value){
        var speed = normalizeTickerSpeed(value);
        if (speed <= 50) return 'ゆっくり';
        if (speed <= 70) return 'ややゆっくり';
        if (speed <= 90) return '標準';
        if (speed <= 120) return 'やや速い';
        return '速い';
      }

      function updateSpeedSettingLabel(){
        elements.settingsSpeedValue.textContent = tickerSpeedLabel(elements.settingsSpeed.value);
      }

      function roomSortValue(value){
        var parsed = parseInt(String(value == null ? '' : value).replace(/[^0-9]/g, ''), 10);
        return isFinite(parsed) ? parsed : 99999;
      }

      function sortResidents(list){
        return list.slice().sort(function(a, b){
          var roomDifference = roomSortValue(a.roomNumber) - roomSortValue(b.roomNumber);
          if (roomDifference) return roomDifference;
          return String(a.name || '').localeCompare(String(b.name || ''), 'ja');
        });
      }

      function residentFromDoc(doc, dorm){
        var data = doc.data() || {};
        return {
          id: doc.id,
          dorm: dorm,
          name: String(data.name || ''),
          roomNumber: String(data.roomNumber == null ? '' : data.roomNumber),
          luggage: toCount(data.luggage),
          mail: toCount(data.mail)
        };
      }

      function createCountElement(type, count){
        var item = document.createElement('span');
        item.className = 'item-count ' + type;
        if (!count) {
          item.className += ' empty';
          item.setAttribute('aria-hidden', 'true');
        }
        var label = document.createElement('span');
        label.className = 'item-label';
        label.textContent = type === 'mail' ? '郵便' : '荷物';
        var value = document.createElement('span');
        value.textContent = String(count);
        item.appendChild(label);
        item.appendChild(value);
        return item;
      }

      function renderDorm(dorm){
        var listElement = dorm === 'shofu' ? elements.shofuList : elements.meizenList;
        var activeResidents = sortResidents(residents[dorm].filter(function(resident){
          return (resident.luggage + resident.mail) > 0;
        }));
        var count = activeResidents.length;
        var compactDisplay = window.innerWidth <= 1100 && window.innerHeight <= 820;
        var columns = compactDisplay ? (count > 11 ? 2 : 1) : (count > 40 ? 3 : count > 11 ? 2 : 1);
        listElement.style.setProperty('--columns', String(columns));
        listElement.classList.toggle('compact', count > 11);
        listElement.classList.toggle('dense', count > 28);

        var fragment = document.createDocumentFragment();
        if (!count) {
          var empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = '現在、届いている荷物・郵便はありません';
          fragment.appendChild(empty);
        } else {
          activeResidents.forEach(function(resident){
            var item = document.createElement('article');
            item.className = 'resident-item';

            var identity = document.createElement('div');
            identity.className = 'resident-identity';
            var room = document.createElement('span');
            room.className = 'resident-room';
            room.textContent = resident.roomNumber || '未設定';
            var name = document.createElement('span');
            name.className = 'resident-name';
            name.textContent = resident.name || '名前未設定';
            identity.appendChild(room);
            identity.appendChild(name);

            var counts = document.createElement('div');
            counts.className = 'resident-counts';
            counts.appendChild(createCountElement('luggage', resident.luggage));
            counts.appendChild(createCountElement('mail', resident.mail));

            item.appendChild(identity);
            item.appendChild(counts);
            fragment.appendChild(item);
          });
        }

        listElement.textContent = '';
        listElement.appendChild(fragment);
      }

      function renderBoard(){
        renderTimer = 0;
        renderDorm('shofu');
        renderDorm('meizen');
        updateLoadingState();
      }

      function scheduleRender(){
        if (renderTimer) return;
        renderTimer = window.setTimeout(renderBoard, 80);
      }

      function renderTicker(){
        var message = String(boardMessage || '').replace(/\s+/g, ' ').trim();
        if (!message) message = '掲示板からのお知らせはありません';
        var signature = message + '\u001f' + tickerSpeed + '\u001f' + window.innerWidth;
        if (signature === tickerSignature) return;
        tickerSignature = signature;

        elements.tickerTrack.textContent = message;
        var estimatedWidth = Math.max(600, signature.length * 32);
        var duration = Math.max(10, Math.round((window.innerWidth + estimatedWidth) / tickerSpeed));
        elements.tickerTrack.style.setProperty('--ticker-duration', duration + 's');
        elements.tickerTrack.style.animation = 'none';
        void elements.tickerTrack.offsetWidth;
        elements.tickerTrack.style.animation = '';
      }

      function updateLoadingState(){
        if (loaded.shofu && loaded.meizen) {
          elements.loadingLayer.classList.add('hidden');
          if (loadingTimer) {
            window.clearTimeout(loadingTimer);
            loadingTimer = 0;
          }
          updateConnectionStatus();
        }
      }

      function updateConnectionStatus(message){
        var text = message || '';
        if (!text && !navigator.onLine) text = 'オフラインです。最後に取得した情報を表示しています。';
        if (!text && (fromCache.shofu || fromCache.meizen)) {
          text = '保存済みの情報を表示中です。接続すると自動更新されます。';
        }
        elements.connectionStatus.textContent = text;
        elements.connectionStatus.classList.toggle('visible', !!text);
      }

      function handleSnapshot(dorm, snapshot){
        var next = [];
        snapshot.forEach(function(doc){
          next.push(residentFromDoc(doc, dorm));
        });
        residents[dorm] = next;
        loaded[dorm] = true;
        fromCache[dorm] = !!(snapshot.metadata && snapshot.metadata.fromCache);
        scheduleRender();
      }

      function handleResidentError(dorm, error){
        console.error(dorm + ' board listener failed', error);
        updateConnectionStatus('寮生情報との接続が切れました。自動で再接続しています。');
        if (!loaded[dorm]) {
          elements.loadingLayer.classList.add('slow');
          elements.loadingNote.textContent = '接続に時間がかかっています。通信状態を確認してください。';
        }
      }

      function subscribe(){
        db.collection('residents_shofu').onSnapshot(
          { includeMetadataChanges: true },
          function(snapshot){ handleSnapshot('shofu', snapshot); },
          function(error){ handleResidentError('shofu', error); }
        );
        db.collection('residents_meizen').onSnapshot(
          { includeMetadataChanges: true },
          function(snapshot){ handleSnapshot('meizen', snapshot); },
          function(error){ handleResidentError('meizen', error); }
        );
        db.collection('settings').doc('board_display').onSnapshot(
          { includeMetadataChanges: true },
          function(snapshot){
            var data = snapshot.exists ? (snapshot.data() || {}) : {};
            boardMessage = String(data.tickerText || '');
            tickerSpeed = normalizeTickerSpeed(data.tickerSpeed);
            loaded.message = true;
            fromCache.message = !!(snapshot.metadata && snapshot.metadata.fromCache);
            renderTicker();
            updateConnectionStatus();
          },
          function(error){
            console.error('board message listener failed', error);
            updateConnectionStatus('掲示板のお知らせとの接続が切れました。自動で再接続しています。');
          }
        );
      }

      function openSettings(){
        elements.settingsMessage.value = boardMessage;
        elements.settingsSpeed.value = String(tickerSpeed);
        updateSpeedSettingLabel();
        elements.settingsPassword.value = '';
        elements.settingsError.textContent = '';
        elements.settingsModal.classList.add('visible');
        window.setTimeout(function(){
          try { elements.settingsMessage.focus(); } catch (_) {}
        }, 0);
      }

      function closeSettings(){
        if (elements.settingsSave.disabled) return;
        elements.settingsModal.classList.remove('visible');
        elements.settingsPassword.value = '';
        elements.settingsError.textContent = '';
      }

      async function saveBoardMessage(event){
        event.preventDefault();
        if (elements.settingsSave.disabled) return;
        var password = String(elements.settingsPassword.value || '');
        var message = String(elements.settingsMessage.value || '').trim();
        if (!password) {
          elements.settingsError.textContent = '管理者パスワードを入力してください。';
          elements.settingsPassword.focus();
          return;
        }

        elements.settingsSave.disabled = true;
        elements.settingsSave.textContent = '保存中';
        elements.settingsError.textContent = '';
        try {
          var adminSnapshot = await db.collection('settings').doc('admin').get();
          var adminData = adminSnapshot.exists ? (adminSnapshot.data() || {}) : {};
          if (!adminData.adminPassword || password !== String(adminData.adminPassword)) {
            elements.settingsError.textContent = '管理者パスワードが違います。';
            elements.settingsPassword.focus();
            return;
          }
          await db.collection('settings').doc('board_display').set({
            tickerText: message,
            tickerSpeed: normalizeTickerSpeed(elements.settingsSpeed.value),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          elements.settingsModal.classList.remove('visible');
          elements.settingsPassword.value = '';
        } catch (error) {
          console.error('board message save failed', error);
          elements.settingsError.textContent = '保存に失敗しました。通信状態を確認してください。';
        } finally {
          elements.settingsSave.disabled = false;
          elements.settingsSave.textContent = '保存';
        }
      }

      function shiftForBurnIn(){
        var step = Math.floor(Date.now() / 900000) % 4;
        var positions = [[0, 0], [1, 0], [1, 1], [0, 1]];
        document.documentElement.style.setProperty('--burn-x', positions[step][0] + 'px');
        document.documentElement.style.setProperty('--burn-y', positions[step][1] + 'px');
      }

      try {
        db.enablePersistence({ synchronizeTabs: true }).catch(function(error){
          console.warn('board persistence unavailable', error && (error.code || error.message));
        });
      } catch (_) {}

      elements.reloadButton.addEventListener('click', function(){
        window.location.reload();
      });

      elements.settingsButton.addEventListener('click', openSettings);
      elements.settingsSpeed.addEventListener('input', updateSpeedSettingLabel);
      elements.settingsCancel.addEventListener('click', closeSettings);
      elements.settingsForm.addEventListener('submit', saveBoardMessage);
      elements.settingsModal.addEventListener('click', function(event){
        if (event.target === elements.settingsModal) closeSettings();
      });
      document.addEventListener('keydown', function(event){
        if (event.key === 'Escape' && elements.settingsModal.classList.contains('visible')) closeSettings();
      });

      elements.fullscreenButton.addEventListener('click', function(){
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (request) {
          try {
            var result = request.call(root);
            if (result && typeof result.catch === 'function') result.catch(function(){});
          } catch (_) {}
        }
      });

      window.addEventListener('online', function(){
        updateConnectionStatus();
      });
      window.addEventListener('offline', function(){
        updateConnectionStatus();
      });
      window.addEventListener('resize', function(){
        scheduleRender();
        renderTicker();
      });

      loadingTimer = window.setTimeout(function(){
        if (!(loaded.shofu && loaded.meizen)) {
          elements.loadingLayer.classList.add('slow');
          elements.loadingNote.textContent =
            '読み込みに時間がかかっています。通信状態を確認して、必要なら再読み込みしてください。';
        }
      }, 12000);

      reconnectTimer = window.setInterval(function(){
        updateConnectionStatus();
      }, 30000);

      shiftForBurnIn();
      window.setInterval(shiftForBurnIn, 900000);
      subscribe();
    })();
  </script>
</body>
</html>
